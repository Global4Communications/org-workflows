name: Build and push Docker image

on:
  workflow_call:
    inputs:
      registry:
        required: false
        type: string
        default: ghcr.io
      owner:
        required: false
        type: string
        default: global4communications
      name:
        description: Image name.  Defaults to the repo name.
        required: false
        type: string
        default: ${{ github.event.repository.name }}
      variant:
        description: >
          Tag family, e.g. staging or php82.  Empty gives latest.
        required: false
        type: string
        default: ''
      dockerfile:
        required: false
        type: string
        default: Dockerfile
      build_args:
        description: >
          Extra build args, one KEY=value per line.  BUILD_COMMIT,
          BUILD_TIMESTAMP and BUILD_RUN are always passed.
        required: false
        type: string
        default: ''
    secrets:
      webservices_pat:
        required: true
    outputs:
      sha_tag:
        description: The immutable commit tag this build pushed
        value: ${{ jobs.build.outputs.sha_tag }}
      digest:
        description: Image digest, for pinning a deploy to exactly this build
        value: ${{ jobs.build.outputs.digest }}

concurrency:
  group: docker-build-${{ github.workflow }}-${{ github.ref }}-${{ inputs.variant }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ inputs.registry }}/${{ inputs.owner }}/${{ inputs.name }}
    outputs:
      sha_tag: ${{ steps.tags.outputs.sha_tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.webservices_pat }}

      # Two tags per build: a moving one to track, and an immutable commit one to
      # pin or roll back to.  A PR moves its own pr-<n> tag, never the shared one.
      #
      # github.sha is the ephemeral merge commit on pull_request events, which
      # names something that does not survive the merge -- use the branch head.
      - name: Tags
        id: tags
        env:
          VARIANT: ${{ inputs.variant }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          prefix="${VARIANT:+$VARIANT-}"
          moving="${PR:+${prefix}pr-$PR}"

          {
            echo "moving=${moving:-${VARIANT:-latest}}"
            echo "sha_tag=${prefix}${SHA}"
            echo "built=$(date -u +%FT%TZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: ${{ inputs.dockerfile }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tags.outputs.moving }}
            ${{ env.IMAGE }}:${{ steps.tags.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            BUILD_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}
            BUILD_TIMESTAMP=${{ steps.tags.outputs.built }}
            BUILD_RUN=${{ github.run_number }}
            ${{ inputs.build_args }}
